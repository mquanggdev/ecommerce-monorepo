<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Biểu tượng Questa: vòng tròn nửa xanh (Thủy) nửa bạc (Kim), sóng cuộn từ vành vào giữa -->
  <defs>
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="10" y1="5" x2="60" y2="95">
      <stop offset="0" stop-color="#7BA7DA"/>
      <stop offset="0.5" stop-color="#3468AA"/>
      <stop offset="1" stop-color="#1A4278"/>
    </linearGradient>
    <linearGradient id="silver" gradientUnits="userSpaceOnUse" x1="90" y1="5" x2="40" y2="95">
      <stop offset="0" stop-color="#F5F7F9"/>
      <stop offset="0.5" stop-color="#C2CAD3"/>
      <stop offset="1" stop-color="#7F8C9B"/>
    </linearGradient>
    <clipPath id="left"><polygon points="-5,-5 44,-5 60,105 -5,105"/></clipPath>
    <clipPath id="right"><polygon points="44,-5 105,-5 105,105 60,105"/></clipPath>
  </defs>

  <!-- Vành bạc dày dần về bên phải, vành xanh dày dần về bên trái -->
  <path clip-path="url(#right)" fill="url(#silver)" fill-rule="evenodd"
    d="M50 3a47 47 0 1 0 0.01 0Z M43 14a37 37 0 1 0 0.01 0Z"/>
  <path clip-path="url(#left)" fill="url(#blue)" fill-rule="evenodd"
    d="M50 3a47 47 0 1 0 0.01 0Z M57 12a37 37 0 1 0 0.01 0Z"/>

  <!-- Sóng xanh mọc từ vành trái, cuộn vào giữa -->
  <path fill="url(#blue)" d="M12 34C24 15 52 13 63 31C68 39 65 48 57 49C61 44 60 37 53 34C42 29 27 34 16 48Z"/>
  <path fill="url(#blue)" d="M15 52C25 39 43 37 51 44C55 48 53 53 49 54C50 50 47 47 42 47C33 47 24 53 19 61Z"/>

  <!-- Sóng bạc mọc từ vành phải, cuộn vào giữa -->
  <path fill="url(#silver)" d="M88 66C76 85 48 87 37 69C32 61 35 52 43 51C39 56 40 63 47 66C58 71 73 66 84 52Z"/>
  <path fill="url(#silver)" d="M85 48C75 61 57 63 49 56C45 52 47 47 51 46C50 50 53 53 58 53C67 53 76 47 81 39Z"/>
</svg>
