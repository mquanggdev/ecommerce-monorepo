# ==========================================================
# Chạy production trên VPS: Nginx (HTTPS) → ecommerce + file-manager
#
# Image được build sẵn trên GitHub Actions và đẩy lên ghcr.io; VPS chỉ pull về.
# Biến ${...} lấy từ file .env nằm cạnh file này (xem deploy/.env.example):
#   DOMAIN, IMAGE_PREFIX, IMAGE_TAG
# Biến bí mật của từng service nằm trong env/ecommerce.env và env/file-manager.env
# ==========================================================
name: questa

x-logging: &default-logging
  # Giới hạn log để không đầy ổ đĩa VPS (mỗi service tối đa 3 file x 10MB)
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Nginx tự thay ${DOMAIN} trong các file *.conf.template khi khởi động
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/99-autoreload.sh:/docker-entrypoint.d/99-autoreload.sh:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      ecommerce:
        condition: service_healthy
      file-manager:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  certbot:
    # Gia hạn chứng chỉ HTTPS (Let's Encrypt) mỗi 12 giờ; chỉ thực sự gia hạn khi còn dưới 30 ngày
    image: certbot/certbot:latest
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped
    logging: *default-logging

  ecommerce:
    image: ${IMAGE_PREFIX}/ecommerce:${IMAGE_TAG}
    env_file:
      - ./env/ecommerce.env
    environment:
      NODE_ENV: production
      # Server → file-manager đi trong mạng nội bộ Docker; trình duyệt tải ảnh qua https://DOMAIN/media/...
      CDN_URL: http://file-manager:4000
      CDN_PUBLIC: https://${DOMAIN}
    depends_on:
      file-manager:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  file-manager:
    image: ${IMAGE_PREFIX}/file-manager:${IMAGE_TAG}
    env_file:
      - ./env/file-manager.env
    environment:
      PORT: 4000
      # Chỉ trả ảnh khi Referer đến từ website (có dấu / ở cuối để không khớp nhầm tên miền khác)
      DOMAIN: https://${DOMAIN}/
    volumes:
      # Ảnh upload: giữ nguyên qua các lần deploy. Nhớ backup volume này (xem docs/4-DEPLOY.md)
      - media-data:/app/media
    restart: unless-stopped
    logging: *default-logging

volumes:
  media-data:
  letsencrypt:
  certbot-www:
